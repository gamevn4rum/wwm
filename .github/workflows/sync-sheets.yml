name: Sync Google Sheets Data

on:
  schedule:
    # Runs once per hour, on the hour (UTC).
    # To change the cadence, edit the cron expression below.
    # (GitHub Actions does not support dynamic cron from repository variables.)
    - cron: '0 * * * *'
  workflow_dispatch:        # manual trigger

permissions:
  contents: write
  actions: write            # needed to trigger deploy.yml below

# Shared with sync-player-stats.yml so the two data-sync jobs never push at once.
concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Fetch sheet data
        working-directory: frontend
        env:
          # Service account auth — the sheet is private and shared only with
          # the service account's client_email (Viewer).
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: node scripts/fetch-data.js

      - name: Encrypt sensitive data files
        working-directory: frontend
        env:
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
        run: node scripts/encrypt-data.js

      - name: Commit and push updated data
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm --cached frontend/data/match-history.json --ignore-unmatch
          git rm --cached frontend/data/members.json --ignore-unmatch
          git add frontend/data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: sync sheet data [skip ci]"

          # Push, tolerating main advancing between checkout and push (the
          # player-stats sync, or a manual push, landing meanwhile).
          #
          # NOT a rebase/merge: the .enc payloads are AES-GCM with a fresh random IV
          # per run, so the same data yields different bytes and git can *never*
          # auto-resolve them — `git pull --rebase` here always ended in a content
          # conflict and the retry could not recover. Instead, keep the freshly
          # generated files, reset onto the newest main, and rebuild the commit
          # there. Nothing to merge, so nothing to conflict.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) — replaying data onto latest main…"

            staged=$(mktemp -d)
            cp -R frontend/data/. "$staged/"
            git fetch origin main
            git reset --hard origin/main
            cp -R "$staged/." frontend/data/
            rm -rf "$staged"

            git rm --cached frontend/data/match-history.json --ignore-unmatch --quiet
            git rm --cached frontend/data/members.json --ignore-unmatch --quiet
            git add frontend/data/
            if git diff --cached --quiet; then
              # The run that beat us already published this data.
              echo "Latest main already carries this data — nothing left to push."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "chore: sync sheet data [skip ci]"
          done
          echo "::error::Failed to push updated data after 5 attempts"
          exit 1

      # Building/deploying now lives in deploy.yml. A push made with the
      # default GITHUB_TOKEN does NOT trigger other workflows' `push`
      # events, so trigger it explicitly instead of relying on that push.
      - name: Trigger deploy workflow
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
