name: Backfill Match History IDs

# Fills the Match History tab's PID/UID columns for rows that have an Opponent but
# no ids — rows added by the Discord bot or by hand, neither of which knows a
# guild's ids.
#
# ⚠ This is the only workflow here that WRITES to the spreadsheet. It needs the
# sheet shared with GOOGLE_SERVICE_ACCOUNT_JSON's client_email as **Editor**; the
# read-only syncs are happy with Viewer. Until that is granted, runs fail with a
# 403 and change nothing.
#
# Ordering: sync-opponent-guilds runs at 03:45 and 15:45 UTC and takes a few
# minutes, so this goes at 04:15 — after it, resolving against a freshly generated
# data/guild-opponents.json. sync-sheets then republishes at 05:00, which is when
# newly filled ids reach the site.

on:
  schedule:
    # Daily at 04:15 UTC, half an hour after the 03:45 opponent-guild sync.
    - cron: '15 4 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write to the sheet (unchecked = dry run, reports only)'
        type: boolean
        default: false
      discover:
        description: 'Sweep the leaderboards for opponents not in the local directory'
        type: boolean
        default: true
      write_ids:
        description: 'Append newly discovered guilds to data/opponent-guild-ids.json'
        type: boolean
        default: true

permissions:
  contents: write

# Shares the data-sync group so this never writes while another job is mid-push.
concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Backfill PID/UID
        id: backfill
        working-directory: frontend
        env:
          # Needs Editor on the sheet, unlike every other workflow here.
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          WWMDB_TOKEN: ${{ secrets.WWMDB_TOKEN }}
        run: |
          # The scheduled run applies; a manual run only applies when asked, so the
          # dispatch form doubles as a safe way to preview what it would do.
          flags=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then
            flags="$flags --apply"
          fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.discover }}" = "true" ]; then
            flags="$flags --discover"
          fi
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.write_ids }}" = "true" ]; then
            flags="$flags --write-ids"
          fi
          echo "Running with:$flags"
          node scripts/backfill-match-ids.js $flags

      - name: Commit newly discovered guild ids
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/data/opponent-guild-ids.json
          if git diff --cached --quiet; then
            echo "No new guild ids to commit"
            exit 0
          fi
          git commit -m "chore: add discovered opponent guild ids [skip ci]"

          # opponent-guild-ids.json is plain sorted JSON, so unlike the .enc payloads
          # in sync-sheets.yml it rebases cleanly if main moved meanwhile.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/3) — rebasing onto latest main…"
            git pull --rebase origin main || exit 1
          done
          echo "Could not push after 3 attempts" >&2
          exit 1
