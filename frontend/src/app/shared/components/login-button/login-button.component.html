@if (authResolved$ | async) {
  @if (currentUser$ | async; as user) {
    <div class="login-badge-wrapper">
      <button
        type="button"
        [class]="'member-badge login-badge rank-' + user.role.toLowerCase()"
        [class.is-open]="menuOpen()"
        [attr.aria-expanded]="menuOpen()"
        aria-haspopup="menu"
        (click)="toggleMenu($event)"
      >
        <div class="badge-avatar">
          <div class="avatar-placeholder">
            <img [src]="user.avatarUrl" [alt]="user.username" />
          </div>
        </div>
        <div class="badge-info">
          <span class="badge-name">{{ user.username }}</span>
          <span class="badge-rank">{{ user.role | uppercase }}</span>
        </div>
        <span class="badge-caret" aria-hidden="true">▾</span>
      </button>

      @if (menuOpen()) {
        <div class="badge-menu" role="menu">
          <button type="button" class="badge-menu-item" role="menuitem" (click)="onProfileClick($event)">
            View Profile
          </button>
          <button type="button" class="badge-menu-item is-danger" role="menuitem" (click)="onLogoutClick($event)">
            Logout
          </button>
        </div>
      }
    </div>
  } @else {
    <button type="button" class="member-badge rank-caller login-badge" (click)="onLoginClick()">
      <div class="badge-info login-only-text">
        <span class="badge-name">LOGIN</span>
      </div>
    </button>
  }
} @else {
  <div class="member-badge login-badge login-skeleton" aria-hidden="true">
    <div class="badge-avatar skeleton-shimmer"></div>
    <div class="badge-info">
      <span class="skeleton-line skeleton-shimmer"></span>
      <span class="skeleton-line skeleton-line--short skeleton-shimmer"></span>
    </div>
  </div>
}
